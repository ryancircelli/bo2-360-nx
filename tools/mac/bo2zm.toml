# bo2-zm-nx for macOS (Apple silicon): settings
#
# This file sits next to the game and is read every time it starts. Each setting is one line, name = value. A line
# that starts with # is a comment: remove the # in front of a setting to use it, and put it back to return to the
# default. Many of these can also be changed in the game's own menus (Options > Graphics and Extras), which remember
# your choice; a value set in this file wins over the remembered one every time the game starts. The names are the
# same as the command-line options (--name=value).

# ---- Graphics ----------------------------------------------------------------------------------------------------

# The renderer. The default draws with Metal directly (gpu_plugin = "metal", bo2zm_renderer = "xenos": the Xbox 360's
# GPU, translated to Metal). To fall back to the "native" renderer, which sends the drawing through Vulkan on MoltenVK
# using the shader library bo2zm_shaders.spvpack next to this file, set these two lines instead (or put them in
# ~/Library/Application Support/bo2-360-nx/args.txt, which wins over this file):
#   gpu_plugin = "xenos"
#   bo2zm_renderer = "native"
gpu_plugin = "metal"
bo2zm_renderer = "xenos"

# Window or full screen.
# fullscreen = true

# Graphics preset: "lowest", "very_low" (the default), "low", "medium" (the highest) or "custom" (the settings picked
# one by one in Options > Graphics). A preset set here wins at every start and applies to every map.
# bo2zm_preset = "very_low"

# Frames per second in the top-left corner.
bo2zm_show_fps = false

# ---- Game --------------------------------------------------------------------------------------------------------

# Start in the Zombies menu, and bring every mode switch back to Zombies (the only mode in this port).
bo2zm_boot_zombies = true
bo2zm_zombies_only = true

# ---- Controllers -------------------------------------------------------------------------------------------------

# A controller that drops out (battery, sleep, out of range) gets its player back when it comes back on.
input_remember_slots = true

# ---- Sound -------------------------------------------------------------------------------------------------------

# Sound blocks (5.3 ms each) queued ahead of the speakers. 4 keeps the sound about 21 ms behind the picture; raise it
# (up to 64) only if the sound crackles.
audio_maxqframes = 4

# The threads that make the sound run as real-time threads, so a busy Mac (a build, other games) cannot starve them
# and leave gaps. "fifo" is a milder fixed priority, "off" leaves them like the other game threads.
# audio_thread_policy = "realtime"

# ---- Logs --------------------------------------------------------------------------------------------------------

# The game writes a log to logs/ next to it. By default it follows DEBUG in Extras: with DEBUG off only warnings and
# errors are written. Set log_level to keep the full log whatever DEBUG says, for example to report a problem.
# log_level = "info"
