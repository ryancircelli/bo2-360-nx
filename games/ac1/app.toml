# The macOS app of this game: read by tools/mac/pack_app.py --game ac1 (tools/mac/make_game_app.sh ac1).
# Game facts the executable needs (title id, executable, renderer defaults) are in game.toml; this file only says how
# the app around it is named, where it keeps saves and logs, and where it looks for the game data.
name = "Assassin's Creed"                         # the app's name and its launcher (CFBundleExecutable)
executable = "ac1"                    # the game binary in the build folder
bundle_id = "io.github.ryancircelli.ac1-360"
version = "0.1.0"
support_folder = "ac1-360"             # ~/Library/Application Support/<this> (saves, settings) and ~/Library/Logs/<this>
env_prefix = "AC1"                 # AC1_DATA, AC1_SUPPORT_DIR, AC1_LOG_DIR, ...
data_path = "~/Games/Xbox360/ac1/disc"       # the extracted disc (default.xex at its top); never copied into the app
settings = "app_settings.toml"               # first settings file; the app keeps the live copy in the support folder
shaders = false                              # no Vulkan shader library: draws with Metal
microphone = "Assassin's Creed uses the microphone only if the game asks for it."

# What tools/mac/build_app.py builds this app from. The recompiled code is made from these exact executables: another
# version of the disc (or a title update, which patches the code) would need its own recompile, so the builder refuses it.
[source]
executables = { "default.xex" = "44f320feebf8241d35e80affc491dafa5ef18bcdd0e62b1c4874a8ec99cc997e" }
codegen_passes = ["read_before_write", "setjmp_locals", "direct_calls", "guest_barriers"]
