[game]
name = "halo3"
title_ids = ["4D5307E6"]
executable = "game:\\default.xex"
local_data_root = "~/Games/Xbox360/halo3/disc"

[defaults]
gpu_plugin = "metal"

[renderer.settings]
# Auto-exposure: the CPU reads the 1x1 luminance resolves (0x1FC1A000/0x1FC1C000,
# 8 KB tiles; the 72x40 downsample is 48 KB). Without the copy back to guest RAM
# the exposure stays stuck and the 3D world renders near-black.
