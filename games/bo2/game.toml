# BO2 Zombies / multiplayer title manifest (rex/game_info.h, LoadGameManifest).
# Compiled into the executable (games/bo2/CMakeLists.txt); edit and rebuild to change.

[game]
name = "bo2zm"                       # config file stem, Switch folder sdmc:/switch/bo2zm
title_ids = ["415608C3"]             # Call of Duty: Black Ops II
# The SDK loads game:\default.xex (the campaign executable). Zombies and multiplayer
# live in default_mp.xex, which games/bo2/ recompiles; the wrong one fails with
# "No function registered at 825C69B8" (default.xex's TU18 entry point).
executable = "game:\\default_mp.xex"
data_root = "game"                   # disc files + default_mp.xexp (TU18) beside the executable
shader_pack = "bo2zm_shaders.spvpack"  # + bo2zm_shaders.spvidx; tools/mac/build_shaders.py
pipeline_list = "bo2zm_pso.psolist"  # native renderer's start-up pipeline list
first_link_port = 1000               # BO2's VDP port; 1001 (UDP) and the side channel's 1002 follow

[defaults]
# Local MP and Zombies expose an offline profile for each controller port.
offline_user_count = 4
instance_pads = 4                    # copies on one Mac (REX_INSTANCE) each keep 4 pads: 2 copies = 8 players

[renderer]
# The Metal backend settings BO2 was measured and shipped with. They are the SDK's
# defaults today; naming them here keeps BO2 on them if a later title changes the
# SDK's. A config file, REX_ variable or command-line option still wins.
quirks = []                          # metal_title_quirks: BO2 needs none

[renderer.settings]
metal_tile_resolve = true            # colour resolves as tile functions inside the draw pass
metal_tile_resolve_half_bits = true  # BO2's HDR luminance chain: RGBA16Float through RGBA16Uint views
metal_resolve_to_texture = true      # resolves land straight in textures
metal_occlusion_real = true          # real occlusion query results
metal_vsync_phase_lock = true        # presentation phase-locked to the display
metal_present_drawables = 2          # two drawables: lower latency
