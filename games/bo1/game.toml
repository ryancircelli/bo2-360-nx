# Call of Duty: Black Ops (Xbox 360) title manifest (rex/game_info.h, LoadGameManifest).
# Compiled into the executable by rexglue_game_manifest() (games/bo1/CMakeLists.txt); edit and rebuild to change.

[game]
name = "bo1"                          # config file stem
title_ids = ["41560855"]
executable = "game:\\default.xex"     # the disc's default.xex, recompiled from games/bo1/bo1_manifest.toml
local_data_root = "~/Games/Xbox360/bo1/disc"  # read-only extracted disc; --game_data_root wins

[defaults]
gpu_plugin = "metal"                     # the native Metal renderer; --gpu_plugin or a config file still wins
