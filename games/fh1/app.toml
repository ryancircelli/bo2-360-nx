# The macOS app of this game: read by tools/mac/pack_app.py --game fh1 (tools/mac/make_game_app.sh fh1).
# Game facts the executable needs (title id, executable, renderer defaults) are in game.toml; this file only says how
# the app around it is named. Saves folder, data path, bundle id and the rest follow from the folder name
# (tools/mac/pack_app.py game_manifest) unless set here.
name = "Forza Horizon"                         # the app's name and its launcher (CFBundleExecutable)
cmake_args = ["-DREXGLUE_BUILD_HOST_TOOLS=ON"]   # the build needs the host rexglue tool (OFF fails to configure)

# What tools/mac/build_app.py builds this app from. The recompiled code is made from these exact executables: another
# version of the disc (or a title update, which patches the code) would need its own recompile, so the builder refuses it.
[source]
executables = { "default.xex" = "db40df605ade49a612b35a7a24c38f6004bcb17a88ed6b48288de16df9e3987c", "SpeechFacade_default.xex" = "d54f6aae6ae2fd6da9b8c37d48f0a6bb295caa18ad82d0d9df66026141a41594", "XMediaFacade_default.xex" = "ed285beefeafcdc90cf64d6085d19c874e3f1e15072c12cdf9ba2237c88e2ce5" }
codegen_passes = []                          # rexglue codegen output as is
