# Forza Horizon (Xbox 360, USA MS-2505, title 4D5309C9) - first recompile attempt.
# Modeled on games/nfsmw/nfsmw_manifest.toml and Pinyon Shift's
# config/rexglue/pinyon_shift_manifest.toml (BSD-3, notices retained in
# overrides-pinyon.toml). default.xex sha1
# 4762ab6e36e8282224fb0f227c8ed318cde210bc matches /tmp/bo2/intake.

[project]
name = "fh1"
sdk_version = "0.10.0"
game_root = "."

[entrypoint]
file_path = "default.xex"
out_directory_path = "generated/default"
# overrides.toml: hand-written declarations, each with its evidence.
# overrides-pinyon.toml: BSD-3 Pinyon Shift analysis facts converted to our
#   schema (functions/switch tables), kept as close to the
#   original as our loader accepts.
# gaps.toml: code gaps, generated by tools/codegen_gaps.py.
includes = ["overrides.toml", "overrides-pinyon.toml", "gaps.toml"]

# Pinyon M4/M2 route traces prove SpeechFacade and XMediaFacade are loaded and
# dispatched at runtime; translate them too (Pinyon manifest does the same).
[[modules]]
guest_path = "SpeechFacade_default.xex"
file_path = "SpeechFacade_default.xex"
out_directory_path = "generated/speech"
includes = ["overrides-speech.toml"]

[[modules]]
guest_path = "XMediaFacade_default.xex"
file_path = "XMediaFacade_default.xex"
out_directory_path = "generated/xmedia"
includes = ["overrides-xmedia.toml"]
