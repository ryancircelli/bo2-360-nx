# Forza Horizon for macOS: settings
#
# The app copies this file to ~/Library/Application Support/fh1-360/fh1.toml the first time it starts and
# reads that copy every time after; edit the copy. Each setting is one line, name = value; a line that starts with #
# is a comment. The names are the same as the command-line options (--name=value). Options in
# ~/Library/Application Support/fh1-360/args.txt win over this file.

# Window (false) or full screen (true).
fullscreen = false

# A controller that drops out (battery, sleep, out of range) gets its player back when it comes back on.
input_remember_slots = true

# Draws whose vertex fetch constant has the "invalid" type are drawn anyway instead of dropped: without it Forza
# Horizon loses about 540 draws (missing geometry) per session.
gpu_allow_invalid_fetch_constants = true

# Keep small GPU resolve results current in guest RAM for the game's exposure feedback.
# Without this, the picture is washed out and brightness pulses between frames.
metal_resolve_readback_max_bytes = 65536
