# The macOS app of this game: read by tools/mac/pack_app.py --game nfsmw (tools/mac/make_game_app.sh nfsmw).
# Game facts the executable needs (title id, executable, renderer defaults) are in game.toml; this file only says how
# the app around it is named, where it keeps saves and logs, and where it looks for the game data.
name = "Need for Speed Most Wanted"                         # the app's name and its launcher (CFBundleExecutable)
executable = "nfsmw"                    # the game binary in the build folder
bundle_id = "io.github.ryancircelli.nfsmw-360"
version = "0.1.0"
support_folder = "nfsmw-360"             # ~/Library/Application Support/<this> (saves, settings) and ~/Library/Logs/<this>
env_prefix = "NFSMW"                 # NFSMW_DATA, NFSMW_SUPPORT_DIR, NFSMW_LOG_DIR, ...
data_path = "~/Games/Xbox360/nfsmw/disc"       # the extracted disc (default.xex at its top); never copied into the app
settings = "app_settings.toml"               # first settings file; the app keeps the live copy in the support folder
shaders = false                              # no Vulkan shader library: draws with Metal
microphone = "Need for Speed Most Wanted uses the microphone only if the game asks for it."
