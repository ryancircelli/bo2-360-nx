# Need for Speed: Most Wanted (Xbox 360, USA) title manifest (rex/game_info.h, LoadGameManifest).
# Compiled into the executable by rexglue_game_manifest() (games/nfsmw/CMakeLists.txt); edit and rebuild to change.

[game]
name = "nfsmw"                          # config file stem
title_ids = ["454107D9"]
executable = "game:\\default.xex"     # the disc's default.xex, recompiled from games/nfsmw/nfsmw_manifest.toml
local_data_root = "~/Games/Xbox360/nfsmw/disc"  # read-only extracted disc; --game_data_root wins

[defaults]
gpu_plugin = "metal"                     # the native Metal renderer; --gpu_plugin or a config file still wins

[renderer.settings]
# Auto-exposure: the CPU reads the 64x64 luminance resolve (16 KB). Without the
# copy back to guest RAM the exposure runs away and the scene blows out white.
metal_resolve_readback_max_bytes = 16384
