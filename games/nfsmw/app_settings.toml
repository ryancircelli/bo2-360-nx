# Need for Speed Most Wanted for macOS: settings
#
# The app copies this file to ~/Library/Application Support/nfsmw-360/nfsmw.toml the first time it starts and
# reads that copy every time after; edit the copy. Each setting is one line, name = value; a line that starts with #
# is a comment. The names are the same as the command-line options (--name=value). Options in
# ~/Library/Application Support/nfsmw-360/args.txt win over this file.

# Window (false) or full screen (true).
fullscreen = false

# A controller that drops out (battery, sleep, out of range) gets its player back when it comes back on.
input_remember_slots = true
