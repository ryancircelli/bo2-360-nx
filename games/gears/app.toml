# The macOS app of this game: read by tools/mac/pack_app.py --game gears (tools/mac/make_game_app.sh gears).
# Game facts the executable needs (title id, executable, renderer defaults) are in game.toml; this file only says how
# the app around it is named, where it keeps saves and logs, and where it looks for the game data.
name = "Gears of War"                         # the app's name and its launcher (CFBundleExecutable)
executable = "gears"                    # the game binary in the build folder
bundle_id = "io.github.ryancircelli.gears-360"
version = "0.1.0"
support_folder = "gears-360"             # ~/Library/Application Support/<this> (saves, settings) and ~/Library/Logs/<this>
env_prefix = "GEARS"                 # GEARS_DATA, GEARS_SUPPORT_DIR, GEARS_LOG_DIR, ...
data_path = "~/Games/Xbox360/gears/disc"       # the extracted disc (default.xex at its top); never copied into the app
settings = "app_settings.toml"               # first settings file; the app keeps the live copy in the support folder
shaders = false                              # no Vulkan shader library: draws with Metal
microphone = "Gears of War uses the microphone only if the game asks for it."

# What tools/mac/build_app.py builds this app from. The recompiled code is made from these exact executables: another
# version of the disc (or a title update, which patches the code) would need its own recompile, so the builder refuses it.
[source]
executables = { "default.xex" = "df1041da72d2b947e3bb2f701a19fde9e84488dc848fea2decd6d43434efe2d1" }
codegen_passes = ["read_before_write", "setjmp_locals", "direct_calls", "guest_barriers"]
