# Need for Speed Hot Pursuit (Xbox 360, title 45410903): Criterion engine game. The disc's executable (Default.XEX) is a small launcher; the game
# itself is the module Alaska.xex.DLL, loaded at runtime. Both are recompiled. No hand-written function lists: gaps.toml is
# derived by tools/codegen_gaps.py; overrides.toml holds only what the analyser cannot derive (see its comments).
[project]
name = "nfshp"
sdk_version = "0.10.0"
game_root = "/tmp/bo2/codegen-gap-prune/inputs/nfshp"

[entrypoint]
file_path = "/tmp/bo2/codegen-gap-prune/inputs/nfshp/default.xex"
out_directory_path = "generated/default"
includes = ["overrides.toml", "gaps.toml"]

[[modules]]
guest_path = "ALASKA.XEX.DLL"
file_path = "/tmp/bo2/codegen-gap-prune/inputs/nfshp/game_module.xex"
out_directory_path = "generated/game"
includes = ["overrides-game.toml", "gaps-game.toml"]
