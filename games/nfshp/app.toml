# The macOS app of this game: read by tools/mac/pack_app.py --game nfshp (tools/mac/make_game_app.sh nfshp).
# Game facts the executable needs (title id, executable, renderer defaults) are in game.toml; this file only says how
# the app around it is named, where it keeps saves and logs, and where it looks for the game data.
name = "Need for Speed Hot Pursuit"                         # the app's name and its launcher (CFBundleExecutable)
executable = "nfshp"                    # the game binary in the build folder
bundle_id = "io.github.ryancircelli.nfshp-360"
version = "0.1.0"
support_folder = "nfshp-360"             # ~/Library/Application Support/<this> (saves, settings) and ~/Library/Logs/<this>
env_prefix = "NFSHP"                 # NFSHP_DATA, NFSHP_SUPPORT_DIR, NFSHP_LOG_DIR, ...
data_path = "~/Games/Xbox360/nfshp/disc"       # the extracted disc (default.xex at its top); never copied into the app
settings = "app_settings.toml"               # first settings file; the app keeps the live copy in the support folder
shaders = false                              # no Vulkan shader library: draws with Metal
microphone = "Need for Speed Hot Pursuit uses the microphone only if the game asks for it."

# What tools/mac/build_app.py builds this app from. The recompiled code is made from these exact executables: another
# version of the disc (or a title update, which patches the code) would need its own recompile, so the builder refuses it.
[source]
executables = { "Default.XEX" = "faa878be8fa0c3bc764600f20188494559f76767f8083e71f958e36c13b3140a", "Alaska.xex.DLL" = "4d3f53616c3df82bf308e366b01de868c4e5f257725ca9289a18a89fc0915139" }
codegen_passes = ["read_before_write", "setjmp_locals", "direct_calls", "guest_barriers"]   # as tools/criterion_codegen.sh
