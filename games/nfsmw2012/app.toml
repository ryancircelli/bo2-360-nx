# The macOS app of this game: read by tools/mac/pack_app.py --game nfsmw2012 (tools/mac/make_game_app.sh nfsmw2012).
# Game facts the executable needs (title id, executable, renderer defaults) are in game.toml; this file only says how
# the app around it is named, where it keeps saves and logs, and where it looks for the game data.
name = "Need for Speed Most Wanted 2012"                         # the app's name and its launcher (CFBundleExecutable)
executable = "nfsmw2012"                    # the game binary in the build folder
bundle_id = "io.github.ryancircelli.nfsmw2012-360"
version = "0.1.0"
support_folder = "nfsmw2012-360"             # ~/Library/Application Support/<this> (saves, settings) and ~/Library/Logs/<this>
env_prefix = "NFSMW2012"                 # NFSMW2012_DATA, NFSMW2012_SUPPORT_DIR, NFSMW2012_LOG_DIR, ...
data_path = "~/Games/Xbox360/nfsmw2012/disc"       # the extracted disc (default.xex at its top); never copied into the app
settings = "app_settings.toml"               # first settings file; the app keeps the live copy in the support folder
shaders = false                              # no Vulkan shader library: draws with Metal
microphone = "Need for Speed Most Wanted 2012 uses the microphone only if the game asks for it."

# What tools/mac/build_app.py builds this app from. The recompiled code is made from these exact executables: another
# version of the disc (or a title update, which patches the code) would need its own recompile, so the builder refuses it.
[source]
executables = { "DEFAULT.XEX" = "81806b65e1ca4a6891cb9c063428f7b205f56715d763897dd8ad082f8649851e", "HAWAII.XEX.DLL" = "3b6d80ac90422fd6c459cb89550e60bb9de1e5f628d4f494a81c605ba045e1d8" }
codegen_passes = ["read_before_write", "setjmp_locals", "direct_calls", "guest_barriers"]   # as tools/criterion_codegen.sh
