# The macOS app of this game: read by tools/mac/pack_app.py --game fallout3 (tools/mac/make_game_app.sh fallout3).
# Game facts the executable needs (title id, executable, renderer defaults) are in game.toml; this file only says how
# the app around it is named, where it keeps saves and logs, and where it looks for the game data.
name = "Fallout 3"                         # the app's name and its launcher (CFBundleExecutable)
executable = "fallout3"                    # the game binary in the build folder
bundle_id = "io.github.ryancircelli.fallout3-360"
version = "0.1.0"
support_folder = "fallout3-360"             # ~/Library/Application Support/<this> (saves, settings) and ~/Library/Logs/<this>
env_prefix = "FALLOUT3"                 # FALLOUT3_DATA, FALLOUT3_SUPPORT_DIR, FALLOUT3_LOG_DIR, ...
data_path = "~/Games/Xbox360/fallout3/disc"       # the extracted disc (default.xex at its top); never copied into the app
settings = "app_settings.toml"               # first settings file; the app keeps the live copy in the support folder
shaders = false                              # no Vulkan shader library: draws with Metal

# What tools/mac/build_app.py builds this app from. The recompiled code is made from these exact executables: another
# version of the disc (or a title update, which patches the code) would need its own recompile, so the builder refuses it.
[source]
executables = { "default.xex" = "a8c568e5ded73479eb901d913af83634cb33a66331cea9f1c090059a88d56396" }
codegen_passes = ["read_before_write", "setjmp_locals", "direct_calls", "guest_barriers"]   # as tools/fallout3_codegen.sh
