# ============================================================================
#  BO2 Zombies (TU18 default_mp.xex) - manual declarations for the codegen
#
#  Included from bo2zm_manifest.toml. Included files use the flat schema
#  (sections at the root). Each entry says why it is here and the evidence.
#  Valid address range: 0x82000000 - 0x84CE0000 (base + 47,054,848 bytes).
#
#  Fields per function (all optional): name, size | end, parent, share_registers.
# ============================================================================

# --- setjmp / longjmp (root keys: must stay ABOVE [functions]) ---------------
# BO2 recovers from Com_Error by longjmp-ing back to a setjmp (20 call sites).
# A static recompile cannot jump into the middle of a C++ function, so the
# codegen routes these two through the runtime's ppc_setjmp / ppc_longjmp.
# Without them the first boot died 3 s in, writing to 0x826F6D7C, just after
# the setjmp call in sub_826F6D10.
#   0x82918CA0 setjmp : checks a hook at 0x84BF87D4, then stfd f14-f31,
#                       std r13-r31, stvx128 v64-v127 into the buffer at r3
#   0x82919E50 longjmp: r7 = env, r6 = val (0 -> 1), lfd f14.. / ld r13..
#                       from the buffer
setjmp_address = 0x82918CA0
longjmp_address = 0x82919E50

# --- mfmsr / mtmsrd: no global lock (root key) -------------------------------
# 671 game functions (1,120 sites) wrap their lwarx/stwcx. atomics in
# "mfmsr rX; mtmsrd r13,1 ... mtmsrd rX,1" (interrupts off on that hardware
# thread). By default the codegen turns these into REX_ENTER/LEAVE/CHECK_GLOBAL_LOCK,
# one std::recursive_mutex shared by every thread. On the Switch (Town at 0-4 fps
# in the first hardware profiles) the game threads spent ~70% of their samples
# blocked in svcArbitrateLock on it, even with a spin-first lock
# (src/bo2zm_switch_mutex.cpp). The atomicity those loops need comes from
# lwarx/stwcx., which the codegen emits as compare-and-swap; on the 360 turning
# interrupts off never excluded the other cores. So the lock goes: mfmsr/mtmsrd
# become no-ops.
skip_msr = true

# --- Registers as C++ locals (root keys: must stay ABOVE [functions]) ---------
# In TOML a loose key belongs to the last table opened: written below [functions]
# these would land inside it, and the codegen would ignore them without a word.
# By default every PowerPC register lives in the PPCContext struct in memory (ctx),
# so the compiler loads and stores it around every use. These four make the codegen
# use C++ locals instead, which the compiler keeps in host registers. Generated code
# without them (tools/codegen_stats.py): 29,485 calls to the
# __savegprlr_N/__restgprlr_N helpers, 167,098 uses of ctx.xer, 20,752 of ctx.ctr,
# 308,618 of ctx.cr0-7.
#   cr_as_local            condition registers cr0-cr7 (compare results)
#   xer_as_local           XER (carry/overflow; every compare reads its so bit)
#   ctr_as_local           CTR (loop counts, the target of bctr/bctrl)
#   non_volatile_as_local  r14-r31, f14-f31, v14-v31/v64-v127; the __save*/__rest*
#                          helper calls disappear
# What has to stay in ctx is marked share_registers in [functions] below:
#   - pieces of split functions that read registers their parent set up
#     (tools/read_before_write.py finds them; run it after every codegen);
#   - hooks that read their caller's r14-r31/cr/ctr/xer from ctx (none today; every
#     hook was audited for it).
# The callers of a share_registers function pass their locals through ctx
# (the SDK's emit_call_sharing_registers), and every bctr does too.
# Not enabled: non_argument_as_local (it would localize r12, which __savevmx_N
# takes as a base) and skip_lr (hooks read ctx.lr: relaunch, party, Com_Error,
# D3D trace).
cr_as_local = true
xer_as_local = true
ctr_as_local = true
non_volatile_as_local = true
# The scratch vector registers as locals: v0 and VMX128's volatile half v32-v63, never an argument or a return value,
# so no callee reads them and no caller counts on them after a call; ~82,000 uses of them in the generated code
# (ctx.v0 ~12,300, v32-v63 ~70,000), each a 16-byte load or store of the context. Not v1: BO2 passes vectors in it
# (55 functions read it before writing it). The animation sampler sub_824D74D0 (~5 % of a core on the job workers and
# the Server) had 51 % of its samples on lines that touch ctx.v32-v63 and 24 % on 16-byte stores in a line profile on
# the console; its guest vector loads stay. share_registers pieces keep them in ctx.
vector_scratch_as_local = true

[functions]

# --- Standalone thunks the analyzer never claimed -----------------------------
# Each is reached only by a tail branch (`b`) from a small wrapper, so nothing
# marks its start. Disassembly (tools/inspect/ppc_dis.py on the TU18 image):
#
# Wrappers at 0x82798xxx load a global singleton (lwz r3,-0x5E54(0x84790000))
# and tail-branch to:
"0x8279F8F0" = { }   # lis/ori r11,0x17164; lwzx r3,r3,r11; blr   (getter)   <- 0x827981B0
"0x8279F908" = { }   # addi r3,r3,0x110; b 0x827C0590   (this-adjust thunk) <- 0x82798244
"0x8279F910" = { }   # addi r3,r3,0x110; b 0x827C0598   (this-adjust thunk) <- 0x82798258
"0x8279F918" = { }   # addi r3,r3,0x110; b 0x827C05A0   (this-adjust thunk) <- 0x82798268
"0x8279F920" = { }   # addi r3,r3,0x110; b 0x827C05A8   (this-adjust thunk) <- 0x827982A0
"0x8279F928" = { }   # addis/addi r3,r3,0x17190; blr    (getter)            <- 0x82798278
#
# Setter right after the bctr of the jump-table function that ends at 0x8249AD04;
# the wrapper at 0x82534100 loads a per-thread object (r13) and tail-branches here.
"0x8249AD08" = { }   # stw r4,0x20(r3); blr                                  <- 0x82534110
#
# Slot 7 of the allocator function table at 0x829873F0 (dispatched by 0x8249AB70 and
# 0x8249AC68..0x8249ACE0): the release entry, a lone 4-byte tail branch that
# tools/codegen_gaps.py skips (it ignores segments under 8 bytes). Reached when a
# match ends, the map changes or a split-screen player leaves.
"0x8249A9C0" = { size = 4 }   # b 0x8248EB80   <- table 0x829873F0[7]

# --- Tail-branch targets, round 1 (tools/codegen_fix_unresolved.py) ---
"0x827C0590" = { }   # lwz r3, 0(r3); b 0x827c2250   <- 0x8279F90C
"0x827C0598" = { }   # lwz r3, 0(r3); b 0x827c2260   <- 0x8279F914
"0x827C05A0" = { }   # lwz r3, 0(r3); b 0x827c2258   <- 0x8279F91C
"0x827C05A8" = { }   # slwi r11, r4, 3; add r11, r11, r3; stfs f1, 8(r11); stw r5, 4(r11); blr   <- 0x8279F924

# --- Entry stubs glued onto the end of the previous function -----------------
# sub_82274C38(mode) stores the mode, then calls sub_827D36E8("default_mp.xex", 0)
# = XamLoaderLaunchTitle, which never returns. The analyzer therefore kept going
# into the next bytes, which are a separate entry reached only by function
# pointer (the Zombies menu choice):
#   0x82274C98: li r3,1; b 0x82274C38    ("relaunch in mode 1")
#   0x82274CA0: li r3,0; b 0x82274C38    (already its own function)
# Symptom: [FATAL] Call to invalid or unregistered function at 0x82274C98,
# right after selecting Zombies.
"0x82274C38" = { end = 0x82274C98 }
"0x82274C98" = { }

# --- Software-pipelined VMX loops that read v57-v63 before writing them ------
# With vector_scratch_as_local, tools/read_before_write.py found two:
# their loop's first pass reads v59-v62 (vsldoi128 with the previous pass's
# vectors) before the loop writes them, so on the 360 it sees whatever those
# registers held, possibly this function's own previous call (their callers,
# sub_82821710 and sub_82821E88, set none of them). They keep every register in
# ctx, as before the option, so that value is still there.
"0x828212C0" = { share_registers = true }
"0x82821A80" = { share_registers = true }

# --- Native C library functions ([rexcrt]) -----------------------------------
# The codegen drops each function listed here and calls rexcrt_<key> instead,
# from direct calls and from the dispatch table alike. The keys are ours
# (bo2zm_*), implemented in app/src/bo2zm_crt.cpp, not the SDK's memcpy/memset:
# the SDK's versions return r3 = host pointer - base, which on PC is 0x1000 too
# high for destinations at 0xE0000000+ (PhysicalHostOffset), and MSVC callers
# may use memcpy's return value. Ours leave r3 alone (it already holds dst).
# Every copy is done with memmove semantics, a superset: correct whenever the
# 360 routine was (no overlap, or a forward copy with dst < src).
# Evidence: disassembly in the generated C++ comments and tools/inspect/ppc_dis.py
# on work/dump_tu18/default_mp.image.bin; call sites counted in the generated
# code.
[rexcrt]
#  0x82916330 memcpy, CRT (981 call sites). r3 dst, r4 src, r5 n. Saves dst with
#    std r3,-8(r1) and every exit is ld r3,-8(r1); blr. Byte/word/doubleword and
#    128-byte ld/std loops, forwards only, with dcbt/dcbtst hints; n = 0 copies
#    nothing (0x829163BC/0x82916588 paths).
bo2zm_memcpy = 0x82916330
#  0x82916270 memmove, CRT (90 call sites). cmpw r3,r4; beqlr; dst < src: b
#    0x82916330 (the memcpy above); else a backward byte/word copy that ends with
#    r3 = dst.
bo2zm_memmove = 0x82916270
#  0x82916AE0 memset, CRT (721 call sites). r3 dst, r4 value, r5 n. The cursor
#    is r6 (ori r6,r3,0), r3 is never written; the low byte of r4 is replicated
#    with rlwimi r4,r4,8,16,23 / rlwimi r4,r4,16,0,15; n = 0 stores nothing.
bo2zm_memset = 0x82916AE0
#  0x827D33F0 VMX memcpy (XMemCpy-like; 875 call sites). mr r26,r3 ... every
#    exit is mr r3,r26. Under 16 bytes: ld/std, sub_829167B8 (word copy), bytes;
#    otherwise lvx128/vperm128/stvx128 in 128-byte blocks with dcbzl on the
#    destination lines ahead, so the 360 version never allowed overlap.
bo2zm_xmemcpy = 0x827D33F0
#  0x827D2EC0 VMX memset (XMemSet-like; 1,524 call sites). r3 is never written
#    (cursor r10). Under 16 bytes: stbx of extsb r4; otherwise the low byte of
#    r4 splatted (lvsl/vslb/vor/vspltb), stvlx head, stvx128, dcbzl for 128-byte
#    lines (plain dcbzl when the byte is 0), stvrx tail.
bo2zm_xmemset = 0x827D2EC0
#  0x827D3290 and 0x827D3340: big copies (5 and 1 call sites). n < 256: bl
#    0x82916330. Otherwise memcpy up to a 128-byte aligned destination, a VMX
#    kernel for the 128-byte blocks (sub_827DC5C4/sub_827DC2A0, or
#    sub_827DCE20/sub_827DCA90 in the second one), memcpy for the rest; both end
#    with mr r3,r27 (dst).
bo2zm_bigcopy = 0x827D3290
bo2zm_bigcopy2 = 0x827D3340
